# Sets up where the job's Docker pulls Docker Hub images from (decision 45).
#
# 1. Google's copy of Docker Hub (mirror.gcr.io) first: same images, same digests,
#    no sign-in, so Docker Hub's limits and outages don't fail the checks. Docker
#    falls back to Docker Hub by itself when the mirror lacks an image or fails.
#    The image builder (buildx) gets the same mirror in ci.yml.
# 2. Logged in to Docker Hub, for those fallbacks: the pulls count against our
#    account's limit, not the anonymous one GitHub's shared runners run out of.
#    The username and a read-only token are GitHub secrets, copied from the
#    1Password item "dockerhub": the checks run on every branch, so they never get
#    the 1Password token. Without them (Dependabot's runs), or when the login keeps
#    failing, the fallback pulls are anonymous.
name: Docker pulls
description: Google's Docker Hub mirror first, then Docker Hub logged in from the DOCKERHUB_* secrets
inputs:
  username:
    description: secrets.DOCKERHUB_USERNAME
    required: false
    default: ""
  token:
    description: secrets.DOCKERHUB_TOKEN (public repos, read-only)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Pull through Google's Docker Hub mirror
      shell: bash
      run: |
        conf=/etc/docker/daemon.json
        current=$(sudo cat "$conf" 2>/dev/null || echo '{}')
        echo "$current" | jq '.["registry-mirrors"] = ["https://mirror.gcr.io"]' | sudo tee "$conf" > /dev/null
        sudo systemctl restart docker
        docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'

    - name: Log in to Docker Hub
      if: inputs.username != '' && inputs.token != ''
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.username }}
        DOCKERHUB_TOKEN: ${{ inputs.token }}
      # Docker Hub's sign-in sometimes times out. Three tries, waiting 5 s then
      # 15 s plus a random 0-5 s so parallel jobs don't retry together. If every
      # try fails the job goes on: the mirror doesn't need it.
      run: |
        for wait in 5 15 0; do
          if printf %s "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin; then
            exit 0
          fi
          [ "$wait" -gt 0 ] || break
          sleep $((wait + RANDOM % 6))
        done
        echo "::warning::Docker Hub login failed 3 times; fallback pulls are anonymous"
