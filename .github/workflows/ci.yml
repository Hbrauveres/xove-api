# Commit checks: stages 1–3 of the pipeline, on every commit.
#
#   1 · Build               the API's Docker image, saved as an artifact
#   2 · Validate build      start the database and the API from that image, wait until healthy
#   3 · Unit tests          JUnit + Testcontainers; keeps the OpenAPI description they generate
#   3 · Vulnerability scan  Trivy on the image
#   3 · SAST                Semgrep on the source code
#
# Runs on every push to any branch except main, so a branch is checked commit by
# commit, before and after a pull request exists. A pull request's required checks
# are these same runs (GitHub matches checks by commit). A release calls this
# workflow first on main.
# Full explanation: docs/pipeline.md in the xove-workspace repo

name: Commit checks

on:
  push:
    branches-ignore: [main]
  workflow_call:
    secrets:
      # For the Docker Hub login (.github/actions/docker-pulls); without them the pulls stay anonymous.
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  # A new commit on a branch cancels the older run; runs for main always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/hbrauveres/xove-api
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  SEMGREP_IMAGE: semgrep/semgrep:1.177.0

jobs:
  # ---------------------------------------------------------------- stage 1
  build:
    name: 1 · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/docker-pulls
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder pulls base images through Google's Docker Hub mirror too,
          # falling back to Docker Hub (logged in) by itself.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          tags: ${{ env.IMAGE }}:ci
          outputs: type=docker,dest=${{ runner.temp }}/api.tar
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Keep the image for the next stages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-api
          path: ${{ runner.temp }}/api.tar
          retention-days: 3

  # ---------------------------------------------------------------- stage 2
  validate:
    name: 2 · Validate build
    needs: build
    runs-on: ubuntu-latest
    env:
      # Throwaway values: this stack lives for a minute inside the runner.
      APP_ENV: ci
      IMAGE_TAG: ci
      POSTGRES_HOST: db
      POSTGRES_DB: xove
      POSTGRES_USER: xove
      POSTGRES_PASSWORD: ci-only-password
      # compose.yaml (the API, as the servers deploy it) plus compose.local.yaml (a throwaway database).
      COMPOSE_FILE: compose.yaml:compose.local.yaml
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      ADMIN_EMAILS: ""
      LIVEKIT_URL: ""
      LIVEKIT_API_KEY: ""
      LIVEKIT_API_SECRET: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/docker-pulls
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-api
          path: ${{ runner.temp }}/images

      - name: Load the image
        run: docker load -i "$RUNNER_TEMP/images/api.tar"

      - name: Start the database and the API, and wait until healthy
        # "Healthy" is defined in compose.yaml, the same check the server's deploy waits for.
        run: |
          docker network create web
          docker network create xove-ci-db
          docker compose up -d --no-build --wait --wait-timeout 150 db api

      - name: Check that the API refuses anonymous requests
        run: docker compose exec -T api sh -c 'wget -S -qO- http://localhost:8080/api/me 2>&1 | grep -q " 401"'

      - name: Show logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------- stage 3
  unit-tests:
    name: 3 · Unit tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/docker-pulls
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: JUnit + Testcontainers
        run: ./mvnw -B verify

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: target/surefire-reports
          retention-days: 7

      # The OpenAPI description the tests generated from the code (docs/api.md, ADR-0067)
      - name: Keep the API's description
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi
          path: target/openapi.json
          if-no-files-found: ignore
          retention-days: 7

  vuln-scan:
    name: 3 · Vulnerability scan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/docker-pulls
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-api
          path: ${{ runner.temp }}/images

      - name: Today's date (the vulnerability database is cached per day)
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-

      - name: Scan the image
        # HIGH and CRITICAL only, and only when a fixed version exists: those are
        # the ones we can act on.
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/images:/images:ro" \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --input /images/api.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /src/.trivyignore --no-progress

  sast:
    name: 3 · SAST
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/docker-pulls
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Semgrep
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --error \
            --config p/default --config p/java --config p/secrets --config p/dockerfile
