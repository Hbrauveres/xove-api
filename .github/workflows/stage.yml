# Stage release: every push to main (a merged pull request).
#
#   Checks                  stages 1–3, the same workflow every commit runs (ci.yml)
#   4 · Publish image       push to GitHub Container Registry as sha-<commit>
#   5 · Deploy stage        through the API's staging key; the VPS starts the new version
#                           next to the serving one, and an unhealthy one never serves
#   6 · Remove failed image only when the new version ran on the VPS and wasn't healthy
#   Notify Discord          posts every result (success, failure, cancelled) to a Discord channel
#
# Full explanation: docs/pipeline.md in the xove-workspace repo

name: Stage release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-release
  # Merges are released one at a time, in order; none is cancelled.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hbrauveres/xove-api

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    # Only the Docker Hub login, never the 1Password token.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ---------------------------------------------------------------- stage 4
  publish:
    name: 4 · Publish image
    needs: checks
    # Only main is released: the server refuses commits that aren't on main
    # (the deploy tool), so a manual run from a branch stops after the checks.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-api
          path: ${{ runner.temp }}/images

      - name: Load the image
        run: docker load -i "$RUNNER_TEMP/images/api.tar"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag with the commit and push
        id: push
        run: |
          tag="sha-${GITHUB_SHA::12}"
          docker tag "$IMAGE:ci" "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Published \`$tag\`." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- stage 5
  deploy:
    name: 5 · Deploy stage
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      app: xove-api
      key: deploy-ssh-api
      command: deploy ${{ github.sha }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  mark-stage:
    name: 5 · Mark the image on stage
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark this image as the one on stage
        run: |
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:stage" "$IMAGE:$TAG"
          echo "Staging's xove-api now runs \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- stage 6
  cleanup:
    name: 6 · Remove failed image
    needs: [publish, deploy]
    # Only when the new version ran and wasn't healthy: a deploy refused before anything
    # changed (GitHub, the registry or 1Password unreachable, another deploy running)
    # keeps the image for a re-run.
    if: failure() && needs.publish.result == 'success' && needs.deploy.outputs.unhealthy == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      TAG: ${{ needs.publish.outputs.tag }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete the failed image from the registry
        # The failed version never served: the previous one kept serving. This removes
        # the image that failed, so nobody deploys it by mistake.
        # GHCR deletes whole versions, not single tags. A commit that didn't change
        # the image (docs only) shares its version with earlier tags, so a version
        # is only deleted when this commit's tag is its only tag.
        run: |
          versions=$(gh api --paginate "/users/$OWNER/packages/container/xove-api/versions" \
            --jq ".[] | select(.metadata.container.tags | index(\"$TAG\")) | \"\(.id) \(.metadata.container.tags | length)\"")
          while read -r id tags; do
            [[ -z "$id" ]] && continue
            if [[ "$tags" == 1 ]]; then
              gh api -X DELETE "/users/$OWNER/packages/container/xove-api/versions/$id"
              echo "deleted xove-api:$TAG (version $id)"
            else
              echo "kept version $id: it also carries $((tags - 1)) other tag(s)"
            fi
          done <<< "$versions"
          echo "Deploy of \`$TAG\` failed: it never served; images only this commit used were removed." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- notify
  notify:
    name: Notify Discord
    needs: [checks, publish, deploy, mark-stage, cleanup]
    # Every release of main, whatever happened; a manual run from a branch isn't a release.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Load the Discord webhook from 1Password
        id: vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.39.0
          # Values only as this step's (masked) outputs, never in the job's environment.
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DISCORD_WEBHOOK_URL: op://Xove API CI/discord-webhook/password

      - name: Post the result to Discord
        env:
          WEBHOOK: ${{ steps.vault.outputs.DISCORD_WEBHOOK_URL }}
          CHECKS: ${{ needs.checks.result }}
          PUBLISH: ${{ needs.publish.result }}
          DEPLOY: ${{ needs.deploy.result }}
          MARK: ${{ needs.mark-stage.result }}
          CLEANUP: ${{ needs.cleanup.result }}
          TAG: ${{ needs.publish.outputs.tag }}
          # Commit text goes through env and jq, never into the script itself.
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          if [[ -z "$WEBHOOK" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set; no notification sent."
            exit 0
          fi

          icon() {
            case "$1" in
              success) echo "✅" ;; failure) echo "❌" ;; cancelled) echo "⚪" ;; *) echo "⏭️" ;;
            esac
          }

          if [[ "$DEPLOY" == "success" ]]; then
            title="✅ API stage release: $TAG is live"; color=3066993
          elif [[ "$CHECKS" == "cancelled" || "$PUBLISH" == "cancelled" || "$DEPLOY" == "cancelled" ]]; then
            title="⚪ API stage release cancelled at ${GITHUB_SHA::12}"; color=9807270
          else
            title="❌ API stage release failed at ${GITHUB_SHA::12}"; color=15158332
          fi

          notes=""
          if [[ "$DEPLOY" == "failure" ]]; then
            notes="The API's deploy failed: the previous version still serves, unless the deploy log says otherwise."
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"

          jq -n \
            --arg title "$title" --argjson color "$color" \
            --arg subject "${MESSAGE%%$'\n'*}" --arg author "$AUTHOR" \
            --arg commit "${GITHUB_SHA::12}" --arg commit_url "$commit_url" \
            --arg run_url "$run_url" --arg notes "$notes" \
            --arg stages "$(icon "$CHECKS") Checks  $(icon "$PUBLISH") Publish  $(icon "$DEPLOY") Deploy  $(icon "$MARK") Mark :stage  $(icon "$CLEANUP") Cleanup" \
            '{
              username: "Xovê pipeline",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: $title,
                url: $run_url,
                color: $color,
                description: ("[`" + $commit + "`](" + $commit_url + ") " + $subject + " — " + $author
                              + (if $notes == "" then "" else "\n\n" + $notes end)),
                fields: [
                  { name: "Stages", value: $stages },
                  { name: "Links", value: ("[Run](" + $run_url + ") · [Staging](https://stage.xove.app)") }
                ]
              }]
            }' > payload.json

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data @payload.json "$WEBHOOK"
