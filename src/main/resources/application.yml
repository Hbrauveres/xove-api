server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        name: XOVE_SESSION
        http-only: true
        secure: true
        same-site: lax

spring:
  mvc:
    # errors come back as RFC 9457 "problem details" JSON; "detail" holds our user-facing message
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health

xove:
  admin-emails: ${ADMIN_EMAILS:}
  livekit:
    url: ${LIVEKIT_URL:}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    room: xove
    token-ttl: 1h
