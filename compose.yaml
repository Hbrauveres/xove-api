# The API on its own: what the server deploys as the app xove-api (spec 0063).
# Locally and in the checks, compose.local.yaml adds a throwaway database.
# Settings come from outside this repo, set per environment, only the ones
# this app needs (ADR-0062).

services:
  api:
    image: ghcr.io/hbrauveres/xove-api:${IMAGE_TAG:-local}
    build: .
    container_name: xove-${APP_ENV:-prod}-api
    restart: unless-stopped
    mem_limit: 512m
    # ${VAR:?…} marks a setting the app can't run without: Compose stops with an
    # error instead of starting it empty. LiveKit and ADMIN_EMAILS are optional.
    environment:
      # The database runs outside this file (on servers, set up per environment;
      # locally and in CI, from compose.local.yaml): the API knows it only by POSTGRES_HOST.
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:?is required (set per environment)}:5432/${POSTGRES_DB:?is required (set per environment)}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?is required (set per environment)}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?is required (set per environment)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?is required (set per environment)}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?is required (set per environment)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # This environment's room: each environment has its own. LiveKit itself runs
      # outside this file, one server per environment (spec 0044).
      LIVEKIT_ROOM: ${LIVEKIT_ROOM:-xove}
      # People in the room at once, 1 to 20 (spec 0060); a test environment can use fewer to try the queue.
      XOVE_ROOM_SEATS: ${XOVE_ROOM_SEATS:-20}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 90s
    networks:
      - web
      - db

networks:
  web:
    external: true
  # The environment's private database network: only the API and its database
  # join it (spec 0062).
  db:
    external: true
    name: xove-${APP_ENV:-prod}-db
